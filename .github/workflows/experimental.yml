# This is an empty workflow for experiments
# Workflows can only be executed when they exist on the main branch.
# To use this workflow create a branch and do your experimental workflow changes on the branch.

name: Experimental workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    # inputs:
    #   name:
    #   type: string

jobs:
  check-runner:
    runs-on: ubuntu-slim
    permissions:
      actions: read
    outputs:
      runner_type: ${{ steps.set-runner.outputs.type }}
    steps:
    - name: Check if Mac Mini is online
      id: set-runner
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Wir suchen nach einem Runner mit dem Label 'self-hosted', der 'online' ist
        STATUS=$(gh api repos/${{ github.repository }}/actions/runners \
          --jq '.runners[] | select(.labels[].name=="self-hosted") | .status' | head -n 1)
        
        if [ "$STATUS" = "online" ]; then
          echo "type=self-hosted" >> $GITHUB_OUTPUT
          echo "Mac Mini ist bereit."
        else
          echo "type=ubuntu-latest" >> $GITHUB_OUTPUT
          echo "Mac Mini ist offline, weiche auf Ubuntu aus."
        fi

  build:
    needs: check-runner
    runs-on: ${{ needs.check-runner.outputs.runner_type }}
    steps:
    - uses: actions/checkout@v4
    - name: Run Build
      run: echo "Ich laufe auf ${{ needs.check-runner.outputs.runner_type }}"